name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'proto/6nz-playable/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site from proto/6nz-playable
        run: |
          mkdir -p _site
          cp proto/6nz-playable/index.html _site/index.html
          # Preserve README alongside for "view source" curiosity
          cp proto/6nz-playable/README.md _site/README.md
          # Add a .nojekyll marker so GitHub Pages serves files with leading underscores
          touch _site/.nojekyll
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
